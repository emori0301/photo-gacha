<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4efe6" />
    <title>オフライン | PhotoGacha</title>
    <!-- 電波が無いときに public/sw.js が返す画面。フォントや CSS を読みに行けないので、すべてこのファイルに書く -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
        background-color: #f4efe6;
        background-image: radial-gradient(
          rgb(33 29 26 / 0.09) 1px,
          transparent 1.2px
        );
        background-size: 22px 22px;
        color: #211d1a;
        font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 32px 24px;
        text-align: center;
        background: #fffdf8;
        border: 2px solid #211d1a;
        border-radius: 24px;
        box-shadow: 5px 5px 0 0 #211d1a;
      }
      svg {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: #5c554d;
        font-size: 15px;
        line-height: 1.7;
      }
      /* 文節の途中で折り返さないよう、まとまりごとに区切る */
      p span {
        display: inline-block;
      }
      button {
        margin-top: 24px;
        height: 48px;
        padding: 0 28px;
        border: 2px solid #211d1a;
        border-radius: 999px;
        background: #e0402a;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        box-shadow: 3px 3px 0 0 #211d1a;
        cursor: pointer;
      }
      button:active {
        transform: translate(3px, 3px);
        box-shadow: none;
      }
      button:focus-visible {
        outline: 3px solid #2f6fd0;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3 16a13 13 0 0 1 26 0Z" fill="#8a8279" />
        <path d="M3 16h26a13 13 0 0 1-26 0Z" fill="#fffdf8" />
        <circle
          cx="16"
          cy="16"
          r="13"
          fill="none"
          stroke="#211d1a"
          stroke-width="2.5"
        />
        <path d="M3 16h26" stroke="#211d1a" stroke-width="2.5" />
      </svg>
      <h1>オフラインです</h1>
      <p>
        <span>インターネットに</span><span>つながっていないようです。</span
        ><br />
        <span>電波の良いところで、</span><span>もう一度</span
        ><span>読み込んでください。</span>
      </p>
      <button type="button" id="reload">再読み込み</button>
    </main>
    <script>
      document
        .getElementById("reload")
        .addEventListener("click", () => location.reload());
      // つながったら自動で元の画面に戻る
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
